[package]
name = "tinyconnect"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "A tiny Windows terminal Spotify Connect controller powered by librespot."
license = "MIT"
repository = "https://github.com/arlyngoodrich/TinyConnect"
readme = "README.md"
keywords = ["spotify-connect", "librespot", "tui", "windows", "audio"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
crossterm = "0.28"
futures-util = "0.3"
librespot = { version = "0.8.0", default-features = false, features = ["native-tls", "rodio-backend", "with-libmdns"] }
ratatui = "0.29"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54.0", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
